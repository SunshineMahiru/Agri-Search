<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>农益搜 | 农业知识指挥中心</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-accent: #2ecc71;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
            url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            margin: 0; padding: 25px;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--text-color);
            overflow-x: hidden;
        }

        .container {
            max-width: 1450px; margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            border-radius: 35px; padding: 35px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 35px;
        }
        .header h1 {
            font-size: 2.2rem; margin: 0; letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .back-btn {
            background: var(--primary-accent); color: white; padding: 12px 30px;
            border-radius: 50px; text-decoration: none; font-weight: 800;
            transition: 0.4s; border: none; display: flex; align-items: center; gap: 10px;
        }
        .back-btn:hover { background: #27ae60; transform: scale(1.05); box-shadow: 0 0 20px rgba(46,204,113,0.5); }

        .stat-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; margin-bottom: 35px;
        }
        .stat-card {
            background: var(--glass-bg); padding: 25px; border-radius: 25px;
            display: flex; align-items: center; gap: 20px;
            border: 1px solid rgba(255,255,255,0.1); transition: 0.3s;
        }
        .stat-card:hover { background: rgba(255,255,255,0.2); transform: translateY(-5px); }
        .stat-card i { font-size: 2.5rem; color: var(--primary-accent); }
        .stat-card h3 { margin: 0; font-size: 0.9rem; opacity: 0.8; }
        .stat-card p { margin: 8px 0 0; font-size: 1.8rem; font-weight: 900; }

        .chart-grid {
            display: grid; grid-template-columns: 1fr 1.2fr; gap: 30px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px; border-radius: 30px;
            height: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .card:hover { transform: scale(1.01); }
        .card.full { grid-column: span 2; height: 500px; }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-microchip"></i> 农业大数据指挥看板</h1>
        <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i> 返回系统首页</a>
    </div>

    <div class="stat-grid">
        <div class="stat-card">
            <i class="fas fa-leaf"></i>
            <div><h3>知识库总数</h3><p id="totalCount">--</p></div>
        </div>
        <div class="stat-card">
            <i class="fas fa-project-diagram"></i>
            <div><h3>关系节点</h3><p id="nodeCount">--</p></div>
        </div>
        <div class="stat-card">
            <i class="fas fa-check-double"></i>
            <div><h3>方案覆盖率</h3><p>100%</p></div>
        </div>
        <div class="stat-card">
            <i class="fas fa-shield-alt"></i>
            <div><h3>系统安全性</h3><p>SHA-256</p></div>
        </div>
    </div>

    <div class="chart-grid">
        <div class="card" id="roseChart"></div>
        <div class="card" id="radarChart"></div>
        <div class="card full" id="auditChart"></div>
    </div>
</div>

<script>
    async function loadData() {
        try {
            const res = await fetch('./searchPests');
            const data = await res.json();

            document.getElementById('totalCount').innerText = data.length;
            document.getElementById('nodeCount').innerText = data.length * 3;

            const crops = ["水稻", "小麦", "玉米", "棉花", "其他"];
            const colors = ['#2ecc71', '#3498db', '#f1c40f', '#e67e22', '#9b59b6'];

            // 1. 南丁格尔玫瑰图
            const rose = echarts.init(document.getElementById('roseChart'));
            const pieData = crops.map((name, index) => ({
                name: name,
                value: data.filter(i => (i.cropId || i.crop_id) === (index + 1)).length
            }));
            rose.setOption({
                title: { text: '作物资源分布', left: 'center', top: 10 },
                tooltip: { trigger: 'item' },
                series: [{
                    name: '病害数量', type: 'pie', radius: [30, 150], roseType: 'radius',
                    itemStyle: { borderRadius: 12 },
                    data: pieData, color: colors
                }]
            });

            // 2. 真实数据雷达图（已修复悬停显示）
            const radar = echarts.init(document.getElementById('radarChart'));
            const top5 = data.slice(0, 5);
            radar.setOption({
                title: { text: '知识密集度审计 (真实字数)', left: 'center', top: 10 },
                // --- 修复点：添加 tooltip ---
                tooltip: {
                    trigger: 'item',
                    confine: true
                },
                // -------------------------
                legend: { bottom: 0, data: top5.map(i => i.name) },
                radar: {
                    indicator: [
                        { name: '症状字数', max: 100 },
                        { name: '方案字数', max: 100 },
                        { name: '总信息量', max: 200 }
                    ],
                    center: ['50%', '50%'], radius: 110
                },
                series: [{
                    type: 'radar',
                    data: top5.map(i => ({
                        value: [i.symptoms.length, i.prevention.length, i.symptoms.length + i.prevention.length],
                        name: i.name
                    })),
                    areaStyle: { opacity: 0.1 }
                }]
            });

            // 3. 全库字数趋势审计图
            const audit = echarts.init(document.getElementById('auditChart'));
            audit.setOption({
                title: { text: '全库数据详尽度审计趋势', left: 'center' },
                tooltip: { trigger: 'axis' },
                legend: { data: ['症状描述字数', '防治方案字数'], top: '8%' },
                xAxis: { type: 'category', data: data.map(i => i.name), axisLabel: { rotate: 25 } },
                yAxis: { type: 'value' },
                dataZoom: [{ type: 'slider', start: 0, end: 50 }],
                series: [
                    { name: '症状描述字数', type: 'bar', data: data.map(i => i.symptoms.length), itemStyle: { color: '#2ecc71' } },
                    { name: '防治方案字数', type: 'line', smooth: true, data: data.map(i => i.prevention.length), itemStyle: { color: '#e67e22' } }
                ]
            });

            window.addEventListener('resize', () => { rose.resize(); radar.resize(); audit.resize(); });
        } catch (e) {
            console.error("Dashboard Load Error:", e);
        }
    }
    loadData();
</script>
</body>
</html>
