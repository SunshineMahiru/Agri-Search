<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识录入 | 农益搜 Agri-Search</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* --- 1. 核心视觉系统（保持与首页高度一致） --- */
    :root {
      --primary: #2d5a27;
      --s-green: #2ecc71;
      --warm-gold: #ffb92d;
      --accent-lime: #cddc39;
      --bg-warm: #fdfaf5;
      --glass: rgba(255, 255, 255, 0.8);
      --shadow: 0 20px 40px rgba(45, 90, 39, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #fdfaf5 0%, #e8f5e9 100%);
      color: #2c3e50;
      min-height: 100vh;
      padding-top: 100px;
      padding-bottom: 50px;
    }

    /* --- 2. 导航栏优化 --- */
    nav {
      position: fixed; top: 0; width: 100%; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 50px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px); /* 兼容 Safari */
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.3);
    }
    .logo { display: flex; align-items: center; gap: 10px; color: var(--primary); text-decoration: none; }
    .logo i { font-size: 1.8rem; color: var(--s-green); }
    .logo b { font-size: 1.4rem; letter-spacing: 1px; }

    .nav-right { display: flex; align-items: center; gap: 20px; }
    .nav-link {
      color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 600;
      display: flex; align-items: center; gap: 6px; transition: 0.3s;
    }
    .nav-link:hover { color: var(--warm-gold); transform: translateY(-2px); }

    /* --- 3. 玻璃拟态表单容器 --- */
    .form-container { max-width: 850px; margin: 0 auto; padding: 0 20px; }
    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 45px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .form-title {
      color: var(--primary); font-size: 2rem; margin-bottom: 35px;
      display: flex; align-items: center; gap: 15px; font-weight: 900;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
    .form-group { margin-bottom: 20px; }
    .full-width { grid-column: 1 / -1; }

    label { display: block; margin-bottom: 10px; font-weight: 700; color: #444; font-size: 0.9rem; }

    .input-style {
      width: 100%; padding: 14px 18px; border: 1.5px solid rgba(0,0,0,0.05);
      border-radius: 15px; font-size: 1rem; outline: none; transition: 0.3s;
      background: rgba(255,255,255,0.5);
    }
    .input-style:focus {
      background: white; border-color: var(--s-green);
      box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.1);
    }

    textarea.input-style { min-height: 100px; resize: none; }

    /* --- 4. 增强版图片上传区 --- */
    .upload-area {
      border: 2px dashed rgba(45, 90, 39, 0.2); padding: 40px; border-radius: 20px;
      text-align: center; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.3);
    }
    .upload-area:hover { border-color: var(--s-green); background: rgba(46, 204, 113, 0.05); }
    .upload-area i { font-size: 3rem; color: #bdc3c7; margin-bottom: 15px; }
    #filePreview { max-width: 100%; height: 200px; object-fit: cover; border-radius: 15px; display: none; margin-top: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

    /* --- 5. 交互按钮 --- */
    .btn-group { display: flex; gap: 15px; margin-top: 40px; }
    .submit-btn {
      flex: 2; padding: 18px; background: linear-gradient(135deg, var(--primary), #3a7d44);
      color: white; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: 800;
      cursor: pointer; transition: 0.4s; box-shadow: 0 10px 25px rgba(45, 90, 39, 0.2);
    }
    .submit-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(45, 90, 39, 0.3); }

    .cancel-btn {
      flex: 1; padding: 18px; background: white; color: #666; text-decoration: none;
      text-align: center; border-radius: 15px; font-weight: 700; border: 1.5px solid #eee; transition: 0.3s;
    }
    .cancel-btn:hover { background: #f8f9fa; color: #333; }

    /* 移动端兼容 */
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      nav { padding: 15px 20px; }
      .logo b { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo"><i class="fas fa-leaf"></i> <b>AGRI-SEARCH</b></a>
  <div class="nav-right">
    <a href="analysis.html" class="nav-link"><i class="fas fa-chart-bar"></i> 数据分析</a>
    <a href="dashboard.html" class="nav-link" style="color: #f1c40f;"><i class="fas fa-chart-line"></i> 决策舱</a>
    <a href="index.html" class="nav-link"><i class="fas fa-home"></i> 返回首页</a>
  </div>
</nav>

<div class="form-container">
  <div class="glass-card">
    <h2 class="form-title"><i class="fas fa-plus-circle"></i> 录入病害专家知识</h2>

    <form id="addDataForm">
      <div class="form-grid">
        <div class="form-group">
          <label><i class="fas fa-tags"></i> 作物分类 <span style="color:var(--s-green)">*</span></label>
          <select class="input-style" id="cropId" name="cropId" required>
            <option value="">请选择类别</option>
            <option value="1">水稻 (Rice)</option>
            <option value="2">小麦 (Wheat)</option>
            <option value="3">玉米 (Corn)</option>
            <option value="4">棉花 (Cotton)</option>
            <option value="5">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label><i class="fas fa-pen-nib"></i> 病害名称 <span style="color:var(--s-green)">*</span></label>
          <input type="text" class="input-style" name="diseaseName" placeholder="如：水稻纹枯病" required>
        </div>
      </div>

      <div class="form-group">
        <label><i class="fas fa-eye"></i> 典型症状描述 <span style="color:var(--s-green)">*</span></label>
        <textarea class="input-style" name="symptoms" placeholder="描述叶片、茎秆或果实的特征变化..." required></textarea>
      </div>

      <div class="form-group">
        <label><i class="fas fa-shield-virus"></i> 防治方案建议 <span style="color:var(--s-green)">*</span></label>
        <textarea class="input-style" name="prevention" placeholder="提供农业、物理或化学防治手段..." required></textarea>
      </div>

      <div class="form-group">
        <label><i class="fas fa-image"></i> 病害图像上传</label>
        <div class="upload-area" onclick="document.getElementById('imageUpload').click()">
          <input type="file" id="imageUpload" name="imageFile" accept="image/*" hidden>
          <div id="uploadPlaceholder">
            <i class="fas fa-cloud-upload-alt"></i>
            <p style="font-weight:700; color:#7f8c8d;">点击选择本地图片</p>
            <p style="font-size:0.8rem; color:#bdc3c7; margin-top:5px;">支持 JPG/PNG 格式，不超过 5MB</p>
          </div>
          <img id="filePreview" src="">
        </div>
      </div>

      <div class="btn-group">
        <button type="submit" class="submit-btn"><i class="fas fa-check-circle"></i> 确认同步数据库</button>
        <a href="index.html" class="cancel-btn">取消</a>
      </div>
    </form>
  </div>
</div>

<script>
  // 1. 实时图片预览逻辑
  document.getElementById('imageUpload').onchange = function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        document.getElementById('uploadPlaceholder').style.display = 'none';
        const preview = document.getElementById('filePreview');
        preview.src = event.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  };

  // 2. 表单异步提交
  document.getElementById('addDataForm').onsubmit = async function(e) {
    e.preventDefault();

    // UI 状态反馈
    const btn = document.querySelector('.submit-btn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在同步数据...';
    btn.disabled = true;

    const formData = new FormData(this);

    try {
      // 注意：此处 URL 需与你的后端 @WebServlet("/addPests") 保持一致
      const response = await fetch('./addPests', {
        method: 'POST',
        body: formData
      });
      const result = await response.json();

      if (result.success) {
        alert('✨ 数据录入成功！');
        window.location.href = 'index.html';
      } else {
        alert('录入失败：' + result.message);
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    } catch (error) {
      alert('网络异常：请确保后端 Servlet 已正确配置并运行');
      btn.innerHTML = originalText;
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
